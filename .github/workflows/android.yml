name: Compilar app Android (APK)

# Genera el APK instalable y lo publica en "Releases". La web enlaza siempre al último:
#   https://github.com/<usuario>/<repo>/releases/latest/download/finanzas.apk
# Se lanza a mano (Actions → Compilar app Android → Run workflow) o al subir una etiqueta v*.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci
      - run: npm test
      - name: Compilar la app para Android
        run: npm run build:native
        env:
          # Mismas variables que usa la web (Settings → Secrets and variables → Actions → Variables).
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - run: npx cap sync android

      - name: Clave de firma
        id: sign
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            # Tolera saltos de línea, espacios y líneas de adorno (----) por si se pegó con formato.
            printf '%s' "$KS_B64" | grep -v '^[[:space:]]*-' | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/finanzas.jks" || {
              echo "::error::El secreto ANDROID_KEYSTORE_BASE64 no es base64 válido. Cópialo de nuevo desde el archivo finanzas-release.jks.base64.txt (una sola línea, sin espacios)."
              exit 1
            }
            if ! keytool -list -keystore "$RUNNER_TEMP/finanzas.jks" -storepass "$KS_PASS" >/dev/null 2>&1; then
              echo "::error::La clave no se puede abrir: revisa ANDROID_KEYSTORE_PASSWORD (debe ser la contraseña que elegiste) y que ANDROID_KEYSTORE_BASE64 esté completo."
              exit 1
            fi
            echo "temporary=false" >> "$GITHUB_OUTPUT"
          else
            # Sin clave propia se crea una temporal: el APK funciona, pero cada compilación
            # tendría otra firma y Android no permitiría actualizar encima (habría que desinstalar).
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/finanzas.jks" -storepass finanzas-temporal -keypass finanzas-temporal \
              -alias finanzas -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Finanzas"
            echo "temporary=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Firmando con una clave TEMPORAL. Crea tu clave con scripts/crear-clave-android.sh y guárdala en los secretos (ver README)."
          fi
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/finanzas.jks" >> "$GITHUB_ENV"

      - name: Generar APK firmado
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'finanzas-temporal' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'finanzas' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || 'finanzas-temporal' }}
        run: ./gradlew assembleRelease -PversionCode=${{ github.run_number }} -PversionName=0.1.${{ github.run_number }} --no-daemon

      - name: Verificar firma
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME"/build-tools/*/apksigner verify --verbose "$APK" | head -5
          cp "$APK" finanzas.apk
          ls -lh finanzas.apk

      - uses: actions/upload-artifact@v4
        with:
          name: finanzas-apk
          path: finanzas.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
          TEMP: ${{ steps.sign.outputs.temporary }}
        run: |
          TAG="android-0.1.${{ github.run_number }}"
          NOTE="App Android de Finanzas (versión 0.1.${{ github.run_number }}). Descarga finanzas.apk en el móvil y ábrelo; Android pedirá permitir la instalación desde el navegador."
          if [ "$TEMP" = "true" ]; then NOTE="$NOTE Firmada con clave temporal: para actualizar hay que desinstalar la anterior."; fi
          gh release create "$TAG" finanzas.apk --title "Finanzas Android 0.1.${{ github.run_number }}" --notes "$NOTE" --latest
