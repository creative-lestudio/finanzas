name: Compilar app iPhone (iOS)

# Dos trabajos:
#  1) «comprobar»: compila la app para el simulador SIN firma. No necesita cuenta de Apple; confirma que el
#     proyecto iOS compila. Se lanza solo al tocar ios/ o a mano.
#  2) «testflight»: firma y sube la app a TestFlight/App Store Connect. Solo corre a mano (marcando «testflight»)
#     y necesita los secretos de Apple descritos en docs/PUBLICACION.md.
on:
  workflow_dispatch:
    inputs:
      testflight:
        description: 'Firmar y subir a TestFlight (requiere los secretos de Apple)'
        type: boolean
        default: false
  push:
    paths: ['ios/**', 'capacitor.config.ts', '.github/workflows/ios.yml']

concurrency:
  group: ios
  cancel-in-progress: true

jobs:
  comprobar:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:native
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - run: npx cap sync ios
      - name: Compilar para el simulador (sin firma)
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -25

  testflight:
    if: ${{ inputs.testflight == true }}
    needs: comprobar
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar secretos
        run: |
          missing=""
          [ -z "${{ secrets.APPLE_TEAM_ID }}" ] && missing="$missing APPLE_TEAM_ID"
          [ -z "${{ secrets.IOS_CERT_P12_BASE64 }}" ] && missing="$missing IOS_CERT_P12_BASE64"
          [ -z "${{ secrets.IOS_CERT_PASSWORD }}" ] && missing="$missing IOS_CERT_PASSWORD"
          [ -z "${{ secrets.IOS_PROFILE_BASE64 }}" ] && missing="$missing IOS_PROFILE_BASE64"
          [ -z "${{ secrets.IOS_WIDGET_PROFILE_BASE64 }}" ] && missing="$missing IOS_WIDGET_PROFILE_BASE64"
          [ -z "${{ secrets.ASC_KEY_ID }}" ] && missing="$missing ASC_KEY_ID"
          [ -z "${{ secrets.ASC_ISSUER_ID }}" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "${{ secrets.ASC_KEY_P8_BASE64 }}" ] && missing="$missing ASC_KEY_P8_BASE64"
          if [ -n "$missing" ]; then echo "::error::Faltan secretos de Apple:$missing (ver docs/PUBLICACION.md)"; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:native
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - run: npx cap sync ios

      - name: Instalar certificado y perfil
        env:
          CERT_P12: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
          WIDGET_PROFILE: ${{ secrets.IOS_WIDGET_PROFILE_BASE64 }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          printf '%s' "$CERT_P12" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k ci "$KC" >/dev/null
          security list-keychains -d user -s "$KC" login.keychain-db
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$PROFILE" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/profile.mobileprovision"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision")")
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          PNAME=$(/usr/libexec/PlistBuddy -c 'Print Name' /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision")")
          echo "PROFILE_NAME=$PNAME" >> "$GITHUB_ENV"
          # Perfil de la extensión del widget (otro identificador: com.lestudio.finanzas.widget).
          printf '%s' "$WIDGET_PROFILE" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/widget.mobileprovision"
          WUUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/widget.mobileprovision")")
          cp "$RUNNER_TEMP/widget.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$WUUID.mobileprovision"
          WNAME=$(/usr/libexec/PlistBuddy -c 'Print Name' /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/widget.mobileprovision")")
          echo "WIDGET_PROFILE_NAME=$WNAME" >> "$GITHUB_ENV"

      - name: Archivar y exportar el IPA
        run: |
          BUILD=${{ github.run_number }}
          # Cada target (app y widget) lleva su propio perfil.
          ruby scripts/set-ios-signing.rb "$APPLE_TEAM_ID" "$PROFILE_NAME" "$WIDGET_PROFILE_NAME"
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -destination 'generic/platform=iOS' archive \
            CURRENT_PROJECT_VERSION=$BUILD MARKETING_VERSION=1.0.$BUILD
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>com.lestudio.finanzas</key><string>$PROFILE_NAME</string><key>com.lestudio.finanzas.widget</key><string>$WIDGET_PROFILE_NAME</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/ipa"
          cp "$RUNNER_TEMP"/ipa/*.ipa "$GITHUB_WORKSPACE/finanzas.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: finanzas-ipa
          path: finanzas.ipa

      - name: Subir a TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_KEY_P8" | tr -d ' \r\n' | base64 -d > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app --type ios --file finanzas.ipa --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
