<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#0b4aa8"/>
      <stop offset="0.55" stop-color="#032a67"/>
      <stop offset="1" stop-color="#011737"/>
    </linearGradient>
    <radialGradient id="light" cx="0.28" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#6fa6ff" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#6fa6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#light)"/>
  <!-- Moneda trasera -->
  <circle cx="610" cy="430" r="200" fill="#ffffff" fill-opacity="0.16"/>
  <!-- Panel de cristal -->
  <rect x="232" y="380" width="560" height="360" rx="96" fill="url(#glass)" stroke="url(#rim)" stroke-width="6"/>
  <!-- Línea de tendencia -->
  <path d="M322 640 L442 548 L532 596 L702 470" fill="none" stroke="#ffffff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="702" cy="470" r="34" fill="#ffffff"/>
</svg>
